<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Clawmachine – Zweite Seite</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: sans-serif;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0; }
    p  { color: #8b949e; margin: 0; }

    /* MJPEG-Stream aus python_server/webserver.py — reines <img>, kein JS
       nötig, der Browser aktualisiert das Bild bei einem
       multipart/x-mixed-replace-Response von selbst. */
    .camera-stream {
      max-width: 100%;
      width: 640px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }
  </style>
</head>
<body>
  <h1>🦾 Zweite Seite</h1>
  <p>Statisches HTML, kein JavaScript — läuft auf einem eigenen Port.</p>

  <img
    class="camera-stream"
    src="http://192.168.0.103:8000/camera/stream"
    alt="Live-Kamerabild der Klaue (nicht verfügbar, falls Server/Kamera gerade nicht laufen)"
  >
</body>
</html>
