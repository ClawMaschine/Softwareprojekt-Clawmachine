<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Clawmachine – Zweite Seite</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      min-height: 100vh;
      background: #0d1117;
      color: #e6edf3;
      font-family: sans-serif;
      text-align: center;
      padding: 1rem;
      box-sizing: border-box;
    }
    h1 { font-size: 2.5rem; margin-bottom: 0; }
    p  { color: #8b949e; margin: 0; }

    /* camera-frame.html refresht sich per <meta http-equiv="refresh"> selbst
       neu und holt dabei ein frisches Einzelbild (siehe webserver.py) — ein
       "Diashow"-Livebild ganz ohne JavaScript. Kein direkter MJPEG-<img>
       mehr: multipart/x-mixed-replace wird von manchen Captive-Portal-
       Browsern (z.B. Switch 2) gar nicht dargestellt. */
    .camera-frame {
      max-width: 100%;
      width: 640px;
      aspect-ratio: 4 / 3;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
    }
  </style>
</head>
<body>
  <h1>🦾 Zweite Seite</h1>
  <p>Statisches HTML, kein JavaScript — läuft auf einem eigenen Port.</p>

  <!-- Eigenes, sich selbst refreshendes Dokument statt direktem <img> —
       dadurch flackert nur das Bild, nicht die ganze Seite. -->
  <iframe class="camera-frame" src="/camera-frame.html" title="Live-Kamerabild der Klaue"></iframe>
</body>
</html>
