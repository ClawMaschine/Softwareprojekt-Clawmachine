; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
upload_speed = 921600
platform = espressif32
board = wemos_d1_mini32
framework = arduino
extra_scripts = pre:scripts/dev/add_network_include.py

[env:claw_motor_controller]
build_src_filter = +<../src_claw_motor_controller/*> -<*>
lib_ldf_mode = deep+
lib_deps =
	Networking
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	madhephaestus/ESP32Servo@^3.0.6
build_flags =
	-DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_motor_controller\"

[env:claw_player_input]
build_src_filter = +<../src_claw_player_input/*> -<*>
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@7.4.3
build_flags = -DCLAW_PLAYER_INPUT_CLIENT_ID=\"claw_player_input\"

[env:claw_1]
build_src_filter = +<../src_claw_1/*> -<*>
lib_deps =
	Networking
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_1\"

[env:claw_2]
build_src_filter = +<../src_claw_2/*> -<*>
lib_deps =
	Networking
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_2\"

[env:claw_3]
build_src_filter = +<../src_claw_3/*> -<*>
lib_deps =
	Networking
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_3\"

[env:src_claw_bluetooth_devices_test]
build_src_filter = +<../src_claw_bluetooth_devices_test/*> -<*>
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_bluettoth_test\"

[env:claw_bt_scanner]
build_src_filter = +<../src_claw_bt_scanner/*> -<*>

[env:claw_switch2_scanner]
build_src_filter = +<../src_claw_switch2_scanner/*> -<*>
lib_deps =
	h2zero/NimBLE-Arduino@^2.5.1
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
monitor_filters = esp32_exception_decoder

[env:claw_panel_test]
build_src_filter =
	+<../src_claw_panel_te?st/*>
	+<../src_claw_player_input/panel_input.cpp>
	+<../src_claw_player_input/panel_input.h>
	-<../src_claw_player_input/joy_con_input.cpp>
	-<../src_claw_player_input/joy_con_input.h>
build_flags = -Isrc_claw_player_input
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2

