; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
upload_speed = 115200
platform = espressif32
board = wemos_d1_mini32
framework = arduino
extra_scripts = pre:scripts/dev/add_network_include.py

[env:claw_motor_controller]
build_src_filter = +<../src_claw_motor_controller/*> -<*>
lib_ldf_mode = deep+
lib_deps =
	Networking
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	madhephaestus/ESP32Servo@^3.0.6
build_flags =
	-DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_motor_controller\"
	; TODO: mit dem Team abstimmen, ob 3 (Achsen x/y/z) oder 4 (physische Stepper-Motoren) gemeldet werden soll
	-DCLAW_MOTOR_COUNT=3

[env:claw_player_input]
upload_resetmethod = nodemcu
board_build.esp-idf.sdkconfig_path = sdkconfig.defaults
board_build.partitions = partitions_singleapp_large_coredump.csv
board_build.embed_txtfiles = 
	managed_components/espressif__esp_insights/server_certs/https_server.crt
	managed_components/espressif__esp_insights/server_certs/mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_mqtt_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_claim_service_server.crt
	managed_components/espressif__esp_rainmaker/server_certs/rmaker_ota_server.crt
lib_deps = 
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
	bblanchon/ArduinoJson@7.4.3
build_flags = -DCLAW_PLAYER_INPUT_CLIENT_ID=\"claw_player_input\"

[env:claw_1]
build_src_filter = +<../src_claw_1/*> -<*>
lib_deps =
	Networking
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_1\"

[env:claw_2]
build_src_filter = +<../src_claw_2/*> -<*>
lib_deps =
	Networking
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_2\"

[env:claw_3]
build_src_filter = +<../src_claw_3/*> -<*>
lib_deps =
	Networking
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	arduino-libraries/Servo@^1.3.0
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_3\"

[env:src_claw_bluetooth_devices_test]
build_src_filter = +<../src_claw_bluetooth_devices_test/*> -<*>
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_bluettoth_test\"

[env:claw_bt_scanner]
build_src_filter = +<../src_claw_bt_scanner/*> -<*>

[env:claw_switch2_scanner]
build_src_filter = +<../src_claw_switch2_scanner/*> -<*>

