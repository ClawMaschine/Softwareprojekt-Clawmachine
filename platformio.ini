; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
; 921600 ist mit den hier verwendeten CP2102-Adaptern nur grenzwertig stabil:
; esptool schaltet um und der erste SPI-Zugriff laeuft dann in ein Timeout
; ("The chip stopped responding" / "Possible serial noise or corruption").
upload_speed = 460800
platform = espressif32
board = wemos_d1_mini32
framework = arduino
extra_scripts = pre:scripts/dev/add_network_include.py

[env:claw_motor_controller]
build_src_filter = +<../src_claw_motor_controller/*> -<*>
lib_ldf_mode = deep+
lib_deps =
	Networking
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit Motor Shield V2 Library@^1.1.4
	madhephaestus/ESP32Servo@^3.0.6
build_flags = 
	-DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_motor_controller\"

[env:claw_player_input]
; joy_con_input.* braucht Bluepad32 (Bluetooth Classic, nur Switch-1-Controller).
; Die Abhaengigkeit ist in 9a2e1c1 absichtlich entfernt worden und der Code in
; main.cpp auskommentiert; die Datei wird aber von +<../src_claw_player_input/*>
; weiterhin mitkompiliert. Bis Bluepad32 wieder eingetragen ist, bleibt sie aussen vor.
build_src_filter =
	+<../src_claw_player_input/*>
	-<../src_claw_player_input/joy_con_input.cpp>
	-<../src_claw_player_input/joy_con_input.h>
	-<*>
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@7.4.3
build_flags = -DCLAW_PLAYER_INPUT_CLIENT_ID=\"claw_player_input\"

[env:claw_endstop]
build_src_filter = +<../src_claw_endstop/*> -<*>
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@7.4.3
build_flags = -DCLAW_PLAYER_INPUT_CLIENT_ID=\"claw_endstops\"

[env:claw_server]
build_src_filter = +<../src_claw_server/*> -<*>
lib_deps =
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@7.4.3
build_flags = -DCLAW_ENDSTOP_CLIENT_ID=\"claw_endstop\"

[env:src_claw_bluetooth_devices_test]
build_src_filter = +<../src_claw_bluetooth_devices_test/*> -<*>
build_flags = -DCLAW_MOTOR_CONTROLLER_CLIENT_ID=\"claw_bluettoth_test\"

[env:claw_bt_scanner]
build_src_filter = +<../src_claw_bt_scanner/*> -<*>

[env:claw_switch2_scanner]
build_src_filter = +<../src_claw_switch2_scanner/*> -<*>
; 460800 bricht auf diesem Board beim Baudraten-Wechsel ab
; ("The chip stopped responding"), 115200 ist hier stabil.
upload_speed = 115200
lib_deps =
	h2zero/NimBLE-Arduino@^2.5.1
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2
monitor_filters = esp32_exception_decoder

[env:claw_panel_test]
build_src_filter = 
	+<../src_claw_panel_test/*>
	+<../src_claw_player_input/panel_input.cpp>
	+<../src_claw_player_input/panel_input.h>
	-<../src_claw_player_input/joy_con_input.cpp>
	-<../src_claw_player_input/joy_con_input.h>
build_flags = -Isrc_claw_player_input
lib_deps = 
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^7.2.2