# Second Page: reines HTML + Kamera-Stream — alles über Port 80, ein Origin.
# Captive-Portal-Browser (z.B. Nintendo Switch 2) lassen oft nur Requests auf
# genau den Host/Port zu, über den die Anmeldeseite kam — deshalb hier der
# Kamera-Stream per Reverse Proxy statt direktem Cross-Port-Request auf :8000.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Deckt /camera/stream (MJPEG-Dauerstream) und /camera/snapshot
    # (Einzelbild, siehe camera-frame.html) mit einem Block ab.
    location /camera/ {
        proxy_pass http://server:8000/camera/;

        # MJPEG ist ein Dauer-Stream (multipart/x-mixed-replace) — ohne
        # proxy_buffering off puffert nginx die komplette Antwort, bevor sie
        # an den Client geht, und aus dem Live-Stream wird nichts. Für
        # /camera/snapshot schadet die Einstellung nicht, nur unnötig.
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }
}
