services:

  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - clawmachine_network

  # DNS: leitet alle Anfragen auf 192.168.0.103 um → Clients landen auf Port 80
  # (second_page, siehe unten)
  captive-dns:
    build:
      context: ./captive-dns
      dockerfile: Dockerfile
    container_name: captive-dns
    restart: unless-stopped
    # host-Netzwerk: Container bindet direkt auf 192.168.0.103:53 (Hotspot-Interface)
    network_mode: host

  # Second Page: statische Test-Seite (reines HTML, kein JS). Liegt bewusst auf
  # Port 80 — dahin leitet captive-dns alle Anfragen um, das Angular-Frontend
  # ist deshalb auf Port 8080 ausgewichen (siehe frontend-Service unten).
  second_page:
    build:
      context: .. # Repo-Root (docker-compose liegt in docker/)
      dockerfile: docker/second_page/Dockerfile
    container_name: clawmachine-second-page
    restart: unless-stopped
    networks:
      - clawmachine_network
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - server

  # Frontend: Angular-App, erreichbar unter http://192.168.0.103:8080
  # (Port 80 ist second_page vorbehalten, siehe oben)
  frontend:
    build:
      context: .. # Repo-Root (docker-compose liegt in docker/)
      dockerfile: docker/frontend/Dockerfile
    container_name: clawmachine-frontend
    restart: unless-stopped
    networks:
      - clawmachine_network
    ports:
      - "0.0.0.0:8080:80"

  server:
    build:
      context: .. # Repo-Root (docker-compose liegt in docker/)
      dockerfile: python_server/Dockerfile
    container_name: clawmachine-server
    restart: unless-stopped
    networks:
      - clawmachine_network
    depends_on:
      - mqtt-broker
    ports:
      # Kamera-MJPEG-Stream (siehe [camera] in config.ini). second_page nutzt
      # das NICHT direkt (nginx proxied intern, siehe docker/second_page/
      # nginx.conf) — dieser Host-Port ist nur noch fürs direkte Debuggen,
      # z.B. curl http://192.168.0.103:8000/camera/stream
      - "0.0.0.0:8000:8000"
    devices:
      # USB-Webcam am Host — Index prüfen (z.B. `v4l2-ctl --list-devices`),
      # falls die Kamera nicht an /dev/video0 hängt
      - "/dev/video0:/dev/video0"

networks:
  clawmachine_network:
    driver: bridge
