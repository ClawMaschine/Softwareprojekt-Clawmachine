# Gemeinsame Projektkonfiguration — Clawmachine
#
# Diese Datei ist die zentrale Konfiguration für Server und ESP-Firmware.
# Sie ist in git eingecheckt und enthält die Standardwerte für den Server-Betrieb
# (MQTT-Broker läuft lokal auf demselben Rechner).
#
# Für lokale Entwicklung (Broker auf einem anderen Rechner):
#   cp config.local.ini.example config.local.ini
#   config.local.ini anpassen — wird von git ignoriert und überschreibt diese Datei.
#
# Nach Änderungen hier: ESP-Firmware-Konfiguration neu generieren:
#   python scripts/dev/generate_firmware_config.py

[mqtt]
# Geteilte Werte — werden auch in include/firmware_config.h verwendet (via generate_firmware_config.py)
broker = 192.168.0.103
port = 1883
username = clawmachine
password = claw_secret

# Nur Frontend — Mosquitto-Listener für WebSockets (siehe docker/mosquitto/config/mosquitto.conf),
# wird in frontend/src/environments/environment.ts eingetragen (via generate_frontend_environment.py)
websocket_port = 9001

client_id = server
connect_timeout_seconds = 5

[wifi]
# ESP-Firmware — WiFi-Zugangsdaten für das Praktikumsnetzwerk
# Diese Werte werden in include/firmware_config.h eingetragen (via generate_firmware_config.py)
ssid = clawmachine_server
password = claw_secret

[hotspot]
# Server Access Point — wird von scripts/setup/setup_hotspot.py verwendet
# SSID und Passwort kommen aus [wifi] (selbes Netz, das die ESP32-Boards erwarten)
ip = 192.168.0.103
prefix = 24
dhcp_start = 192.168.0.100
dhcp_end = 192.168.0.200
dhcp_lease = 12h
channel = 6

[camera]
# USB-Webcam, direkt am Server angeschlossen — nicht über MQTT,
# sondern per eigenem HTTP-MJPEG-Stream (siehe python_server/webserver.py).
# /dev/video<device_index> — welcher Index die richtige Kamera ist, hängt vom
# Gerät ab (z.B. `v4l2-ctl --list-devices` auf dem Server prüfen).
device_index = 0
jpeg_quality = 80
frame_rate = 15
http_port = 8000


[motor_speed]
# Standard-Geschwindigkeiten, mit denen der Python-Server die Achsen faehrt (100 %-Eingabe
# vom Panel bzw. Joy-Con-Stick voll ausgelenkt). Joy-Con-Werte (0-100 %) werden prozentual davon abgeleitet.
# xy_percent / z_percent: Prozent der maximalen Motordrehzahl (0-100)
xy_percent = 100
z_percent = 100
# claw_degrees_per_second: Fahrgeschwindigkeit der Klaue in Grad pro Sekunde
claw_degrees_per_second = 35
# minimum_percent: kleinste Geschwindigkeit, mit der eine Achse faehrt, solange sie
# angesteuert wird. Darunter laufen die Schrittmotoren sichtbar ruckelnd (bei 1 % nur
# ca. 4 Schritte pro Sekunde); kleinere Eingaben werden auf diesen Wert angehoben.
minimum_percent = 15
