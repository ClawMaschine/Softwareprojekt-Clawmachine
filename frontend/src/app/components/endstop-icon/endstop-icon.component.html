<svg viewBox="0 0 140 150" class="claw-icon" role="img" aria-label="Endstop-Status">
  <!-- Rahmen (Gantry, Draufsicht) -->
  <rect x="10" y="20" width="120" height="110" class="frame" />

  <!-- Seil + Klaue (Z-Achse) -->
  <line x1="70" y1="40" x2="70" y2="100" class="rope" />
  <path d="M58 100 L70 118 L82 100" class="claw-shape" />

  <!-- X-Endstops: Enden der horizontalen Schiene -->
  <circle cx="10" cy="75" r="7" class="endstop" [class.triggered]="state.x1" />
  <circle cx="130" cy="75" r="7" class="endstop" [class.triggered]="state.x2" />

  <!-- Y-Endstops: Enden der vertikalen Schiene -->
  <circle cx="70" cy="20" r="7" class="endstop" [class.triggered]="state.y1" />
  <circle cx="70" cy="130" r="7" class="endstop" [class.triggered]="state.y2" />

  <!-- Z-Endstop: Referenzpunkt des Seils oben -->
  <circle cx="70" cy="40" r="6" class="endstop" [class.triggered]="state.z1" />

  <text x="10" y="97" class="label">X1</text>
  <text x="130" y="97" class="label">X2</text>
  <text x="70" y="10" class="label">Y1</text>
  <text x="70" y="144" class="label">Y2</text>
  <text x="86" y="43" class="label label-start">Z1</text>
</svg>
